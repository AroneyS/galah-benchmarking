[workspace]
channels = ["conda-forge", "bioconda"]
name = "35-galah"
platforms = ["linux-64"]

[environments]
default = ["main"]
galah = ["galah"]
drep = ["drep"]
skder = ["skder"]
pyani = ["pyani"]

[feature.main.dependencies]
python = ">=3.8"
biopython = "*"
gffutils = "*"
bcbiogff = "*"
extern = "*"
bird_tool_utils_python = "*"
snakemake = ">=8"
snakemake-executor-plugin-cluster-generic = ">=1"
polars = "*"
xlsx2csv = "*"

[feature.galah.dependencies]
galah = ">=0.5.0"

[feature.drep.dependencies]
drep = "*"

[feature.skder.dependencies]
skder = "*"

[feature.pyani.dependencies]
python = ">=3.11"
blast = "*"
mummer = "*"
fastani = "*"
sourmash = "*"

[feature.pyani.pypi-dependencies]
pyani-plus = "*"
